<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumbite-Your Recipe </title>
    <link rel="stylesheet" href="dishes.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header class="recipe-header">
        <div class="header-container">
            <nav class="nav-links right-nav">
                <a href="index.html#home">Home</a>
                <a href="dishes.html">Your Dishes</a>
            </nav>

            <div class="logo">
                <img src="logo.jpeg" alt="Yumbite Logo">
                <h1>Yum<span>bite</span></h1>
            </div>

            <nav class="nav-links left-nav">
                <a href="index.html#type">Categories</a>
                <a href="index.html#about">About Us</a>
            </nav>
        </div>
    </header>
     <main>
    <form action="/api/recipes" method="POST" enctype="multipart/form-data">
      
      <!-- General Information -->
      <section id="general-info">
        <h2>General Information</h2>
        
        <div>
          <label for="recipe-title">Recipe Title *</label>
          <input type="text" id="recipe-title" name="title" placeholder="e.g., Classic Cherry Chocolate Cake" required>
        </div>

        <div>
          <label for="recipe-summary">Summary</label>
          <textarea id="recipe-summary" name="summary" rows="3" placeholder="Briefly describe your dish, flavor profile, or origin..."></textarea>
        </div>

        <div>
          <label for="recipe-category">Category *</label>
          <select id="recipe-category" name="category_id" required>
            <option value="" disabled selected>Select a category</option>
            <option value="appetizers">Appetizers</option>
            <option value="main-courses">Main Courses</option>
            <option value="desserts">Desserts</option>
            <option value="baked-goods">Baked Goods</option>
            <option value="beverages">Beverages</option>
          </select>
        </div>

        <div>
          <label for="difficulty-level">Difficulty Level</label>
          <select id="difficulty-level" name="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div>
          <label for="prep-time">Prep Time (minutes)</label>
          <input type="number" id="prep-time" name="prep_time_min" min="1" placeholder="20">
        </div>

        <div>
          <label for="cook-time">Cook Time (minutes)</label>
          <input type="number" id="cook-time" name="cook_time_min" min="0" placeholder="45">
        </div>

        <div>
          <label for="servings">Servings</label>
          <input type="number" id="servings" name="servings" min="1" placeholder="4">
        </div>
      </section>

      <!-- Media & Cover Image -->
      <section id="recipe-media">
        <h2>Media</h2>
        <div>
          <label for="cover-image">Cover Photo *</label>
          <input type="file" id="cover-image" name="cover_image" accept="image/png, image/jpeg, image/webp" required>
        </div>
      </section>

      <!-- Ingredients Section -->
      <section id="recipe-ingredients">
        <h2>Ingredients</h2>
        <fieldset>
          <legend>Itemized List</legend>
          
          <div class="ingredient-row">
            <input type="text" name="ingredients[][name]" placeholder="Ingredient (e.g., All-Purpose Flour)" required>
            <input type="text" name="ingredients[][amount]" placeholder="Amount (e.g., 2 cups)" required>
            <button type="button" aria-label="Remove ingredient">Remove</button>
          </div>

          <div class="ingredient-row">
            <input type="text" name="ingredients[][name]" placeholder="Ingredient (e.g., Granulated Sugar)">
            <input type="text" name="ingredients[][amount]" placeholder="Amount (e.g., 1 cup)">
            <button type="button" aria-label="Remove ingredient">Remove</button>
          </div>
        </fieldset>

        <button type="button" id="add-ingredient-btn">+ Add Ingredient</button>
      </section>

      <!-- Preparation Steps Section -->
      <section id="recipe-instructions">
        <h2>Preparation Steps</h2>
        <fieldset>
          <legend>Step-by-Step Instructions</legend>

          <div class="step-row">
            <label for="step-1">Step 1</label>
            <textarea id="step-1" name="steps[]" rows="2" placeholder="Preheat oven to 350°F (175°C) and grease a 9-inch baking pan..." required></textarea>
            <button type="button" aria-label="Remove step 1">Remove</button>
          </div>

          <div class="step-row">
            <label for="step-2">Step 2</label>
            <textarea id="step-2" name="steps[]" rows="2" placeholder="In a large bowl, whisk together flour, cocoa powder, and baking powder..."></textarea>
            <button type="button" aria-label="Remove step 2">Remove</button>
          </div>
        </fieldset>

        <button type="button" id="add-step-btn">+ Add Step</button>
      </section>

      <!-- Form Actions -->
      <div id="form-actions">
        <button type="button" name="action" value="draft">Save Draft</button>
        <button type="submit" name="action" value="publish">Publish Recipe</button>
      </div>

    </form>
  </main>
  <script src="dishes.js"></script>
</body>
</html>
